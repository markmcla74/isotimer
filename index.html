<!doctype html>
<html>
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#add8e6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>IsoTimer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="topContainer"></div>
<div id="timeContainer">
    <div id="timeDisplay">00:00</div>
    <div class="button-group">
        <!-- Delay Start Buttons -->
        <button class="startTimerBtn delayBtn" data-delay="90">Delay 90s</button>
        <button class="startTimerBtn delayBtn" data-delay="60">Delay 60s</button>
        <button class="startTimerBtn delayBtn" data-delay="30">Delay 30s</button>
        <button class="startTimerBtn delayBtn" data-delay="15">Delay 15s</button>
        <button class="startTimerBtn delayBtn" data-delay="5">Delay 5s</button>

        <!-- Controls -->
        <button id="startBtn" class="startTimerBtn">Start</button>
        <button id="stopResumeBtn" class="startTimerBtn">Stop-Resume</button>
        <button id="resetBtn" class="resetTimerBtn">Reset</button>
    </div>
</div>

<!-- Instructions & Info Link (Placed outside #timeContainer) -->
<a href="https://github.com/markmcla74/isotimer/blob/main/README.md"
   target="_blank"
   rel="noopener noreferrer"
   class="info-link">
   Instructions & Info
</a>

<script src="index.js"></script>
</body>
</html>
